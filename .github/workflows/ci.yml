name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pnpm
        name: Bootstrap pnpm
        run: npm install --global --ignore-scripts pnpm@11.17.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: clang-format
        name: Install clang-format
        run: |
          CLANG_FORMAT_VERSION=$(node -p "require('./tools/tool-versions.json').clangFormat")
          python -m pip install --disable-pip-version-check "clang-format==$CLANG_FORMAT_VERSION"
          test "$(clang-format --version)" = "clang-format version $CLANG_FORMAT_VERSION"
      - id: install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: format
        name: Check formatting
        run: |
          pnpm format:check
          find core/viewer core/companion test/core test/companion test/hardware \
            -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 |
            xargs --null clang-format --dry-run --Werror
      - id: lint
        name: Lint
        run: pnpm lint
      - id: typecheck
        name: Type check
        run: pnpm typecheck
      - id: project
        name: Test project contracts
        run: pnpm test:project
      - id: unit
        name: Test renderer and Electron units
        run: pnpm test:unit

  native:
    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            architecture: x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win32
            architecture: x64
          - name: macOS Intel
            runner: macos-15-intel
            platform: darwin
            architecture: x64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: darwin
            architecture: arm64
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: toolchain
        name: Verify native toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          python --version
      - id: native-test
        name: Build and test the native core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ($IsWindows) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
            Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          }
          cmake -S . -B build/native -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
      - id: companion-test
        name: Test the companion process
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 pytest-timeout==2.4.0
          python -m pytest test/companion/companion_process_test.py -vv --timeout=30 --timeout-method=thread

  sanitizers:
    name: Native sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: sanitizer-test
        name: Run native tests with ASan and UBSan
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S . -B build/sanitizers -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNETFT_VIEWER_SANITIZERS=ON
          cmake --build build/sanitizers
          ctest --test-dir build/sanitizers --output-on-failure

  e2e:
    name: Packaged Electron E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NETFT_VIEWER_E2E_BUILD: "true"
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: system-dependencies
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build xvfb libgtk-3-0 libnss3 libasound2t64
      - id: pnpm
        name: Bootstrap pnpm
        run: npm install --global --ignore-scripts pnpm@11.17.0
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - id: install
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: packaged-e2e
        name: Run packaged Electron scenarios
        run: xvfb-run --auto-servernum pnpm test:e2e
      - id: e2e-failure-artifacts
        name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
