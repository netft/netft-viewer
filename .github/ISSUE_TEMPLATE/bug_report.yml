name: Bug report
description: Report a reproducible problem in Net F/T Viewer.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, exact private addresses, and other sensitive network data before submitting.
  - type: input
    id: version
    attributes:
      label: Viewer version
      description: Use the installed version or commit ID.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Universal macOS package
        - Unknown
    validations:
      required: true
  - type: input
    id: sensor
    attributes:
      label: Sensor model and firmware
      description: Provide both when hardware is involved; otherwise enter "Not applicable."
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Sanitized network details
      description: Include topology, routing, firewall, and subnet information without exact private addresses or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest complete sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Attach sanitized logs or screenshots when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: List the exact commands already run and their results.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Hardware safety
      options:
        - label: I confirm that any connected hardware and fixtures are in a safe state for the described actions.
          required: true
