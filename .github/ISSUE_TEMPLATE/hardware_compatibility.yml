name: Hardware compatibility
description: Report verified or unsuccessful behavior with a sensor configuration.
title: "[Hardware] "
labels:
  - hardware
body:
  - type: input
    id: version
    attributes:
      label: Viewer version or commit
    validations:
      required: true
  - type: input
    id: sensor
    attributes:
      label: Sensor model
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Sensor firmware
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Universal macOS package
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Sanitized network setup
      description: Describe direct or switched topology, routing, and firewall behavior without exact private addresses or credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Compatibility result
      description: Include discovery, streaming, bias, pause, and recording behavior that you exercised.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: List exact commands and sanitized results.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Hardware safety
      options:
        - label: I verified that the sensor, tooling, and fixtures were secured and safe throughout the test.
          required: true
        - label: I removed credentials and exact private addresses from this report and its attachments.
          required: true
